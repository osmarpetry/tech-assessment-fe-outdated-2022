type Trial {
  id: Int!
  name: String!
  participants: [Participant!]!
}

type Participant {
  id: Int!
  name: String!
  height: Float!
  weight: Float!
  diabetes: Boolean!
  covid19: Boolean!
}

type Query {
  trials: [Trial!]!
  trial(id: Int!): Trial
}

type Mutation {
  addParticipantToTrial(
    trialId: Int!
    participant: ParticipantInput!
  ): Participant!
}

input ParticipantInput {
  covid19: Boolean!
  diabetes: Boolean!
  height: Float!
  name: String!
  weight: Float!
}